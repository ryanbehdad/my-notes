<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Loading ──────────────────────────────────────────────────────── -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
  </div>

  <!-- ── Login ──────────────────────────────────────────────────────────── -->
  <div id="login-screen" class="hidden">
    <div class="login-card">
      <h1>Notes</h1>
      <p>Your personal notes</p>
      <button id="google-signin-btn" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </div>
  </div>

  <!-- ── App ────────────────────────────────────────────────────────────── -->
  <div id="app" class="hidden">

    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="app-title">Notes</span>
        <div class="user-row">
          <img id="user-avatar" src="" alt="" referrerpolicy="no-referrer">
          <button id="signout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Search…" autocomplete="off" aria-label="Search notes">
      </div>

      <div class="sidebar-new">
        <button id="new-note-btn">+ New Note</button>
      </div>

      <div id="sync-error" class="sync-error hidden">⚠ Sync lost — refresh to reconnect</div>

      <div id="notes-list" class="notes-list" role="list"></div>
    </aside>

    <main class="main">
      <div id="empty-state" class="empty-state">
        <p>Select a note or create a new one</p>
      </div>

      <div id="editor" class="editor hidden">
        <div class="editor-header">
          <button id="back-btn" class="icon-btn back-btn" title="Back to notes" aria-label="Back to notes list">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>
          <input
            type="text"
            id="note-title"
            class="note-title"
            placeholder="Title"
            spellcheck="true"
            aria-label="Note title"
          >
          <button id="delete-note-btn" class="icon-btn icon-btn-danger" title="Delete note" aria-label="Delete note">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </div>
        <textarea
          id="note-content"
          placeholder="Start writing…"
          spellcheck="true"
          aria-label="Note content"
        ></textarea>
        <div class="editor-footer">
          <span id="save-status"></span>
        </div>
      </div>
    </main>

  </div>

  <!-- ── Delete Confirmation Modal ──────────────────────────────────────── -->
  <div id="delete-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-card">
      <h3 id="modal-heading">Delete note?</h3>
      <p>This cannot be undone.</p>
      <div class="modal-actions">
        <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
        <button id="confirm-delete-btn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
